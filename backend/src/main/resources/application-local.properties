# Perfil local: H2 em arquivo (não perde dados ao reiniciar)
# Arquivo: backend/data/barberini.mv.db

spring.datasource.url=jdbc:h2:file:./data/barberini;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Evita o processo “subir e morrer” sem log claro se a porta estiver ocupada
server.port=8080
